name: Dashboard Staging

# Phase 4B: build + mocked Playwright always; Cloudflare Pages deploy is
# manual/workflow_dispatch until Owner Gate 4 attaches staging-app DNS.
on:
  push:
    branches: [master]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-staging.yml'
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-staging.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy built console to Cloudflare Pages project agentpulse-staging-app'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: dashboard-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-mocked:
    name: Dashboard mocked Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Mocked browser E2E
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mocked
          path: dashboard/playwright-report
          if-no-files-found: ignore

  deploy-staging-pages:
    name: Deploy staging console (Cloudflare Pages)
    needs: e2e-mocked
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deploy == 'true' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Build console against staging API
        run: npm run build
        env:
          VITE_API_BASE_URL: https://staging-api.agentpulse.ca
      - name: Publish to Cloudflare Pages (production branch)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          # Resolve Pages production branch so custom domain + apex pages.dev update.
          PROD_BRANCH="$(python3 -c 'import json,os,urllib.request;a=os.environ["CLOUDFLARE_ACCOUNT_ID"];t=os.environ["CLOUDFLARE_API_TOKEN"];u=f"https://api.cloudflare.com/client/v4/accounts/{a}/pages/projects/agentpulse-staging-app";r=urllib.request.Request(u,headers={"Authorization":f"Bearer {t}"});d=json.load(urllib.request.urlopen(r,timeout=30));print((d.get("result") or {}).get("production_branch") or "production")')"
          echo "pages_production_branch=${PROD_BRANCH}"
          npx --yes wrangler@4.115.0 pages deploy dist             --project-name=agentpulse-staging-app             --branch="${PROD_BRANCH}"             --commit-dirty=true
      - name: Verify production host serves console shell
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -4 -fsS -m 20 -H 'Cache-Control: no-cache' https://staging-app.agentpulse.ca/ || true)"
            if printf '%s' "$body" | grep -q 'id="root"' && ! printf '%s' "$body" | grep -qi 'placeholder'; then
              echo "staging-app serves real console shell"
              exit 0
            fi
            echo "attempt=${attempt} still placeholder or empty; waiting"
            sleep 10
          done
          echo "staging-app still not serving built console" >&2
          exit 1
