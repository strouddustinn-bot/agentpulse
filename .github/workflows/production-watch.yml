name: Production Synthetic Watch

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Exercise the incident path without breaking production'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: agentpulse-production-watch
  cancel-in-progress: false

jobs:
  watch-production:
    name: Watch bounded production surfaces
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_VERSION: 0.2.0b6
      EXPECTED_SOURCE_SHA: 9d128c054ba9c5c6e985610fe725e7b8069f3e1b
      RELEASE_REF: v0.2.0-beta.8
      INCIDENT_TITLE: '[ops] AgentPulse production synthetic alert'
      GH_TOKEN: ${{ github.token }}
      SIMULATE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure == true && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Run read-only production synthetic
        id: synthetic
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          FAILED=0

          python scripts/production-smoke.py \
            --expected-version "$EXPECTED_VERSION" \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --attempts 3 \
            --retry-delay 15 \
            --timeout 8 || FAILED=1

          python3 - <<'PY' || FAILED=1
          import ssl
          import urllib.error
          import urllib.request

          url = "https://agentpulse.ca/"
          expected = b"Automatic recovery for the server incidents"
          request = urllib.request.Request(
              url,
              headers={"Accept": "text/html", "User-Agent": "AgentPulse-production-watch/1"},
          )
          try:
              with urllib.request.urlopen(request, timeout=8, context=ssl.create_default_context()) as response:
                  body = response.read(524289)
                  assert response.status == 200, f"unexpected website status {response.status}"
                  assert response.geturl() == url, "website redirected away from canonical URL"
                  assert len(body) <= 524288, "website response exceeded watch safety limit"
                  assert expected in body, "expected public product marker missing"
          except (urllib.error.URLError, TimeoutError, OSError) as exc:
              raise SystemExit(f"website transport failed: {type(exc).__name__}") from exc
          print("public_site=pass")
          PY

          probe_checkout() {
            local plan="$1"
            local expected_status="$2"
            local output="$RUNNER_TEMP/watch-checkout-${plan}.json"
            local status
            status="$(curl --silent --show-error --max-time 8 \
              --output "$output" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/json' \
              --header 'Content-Type: application/json' \
              --header 'Origin: https://app.agentpulse.ca' \
              --data "{\"plan\":\"${plan}\"}" \
              https://api.agentpulse.ca/v1/billing/checkout)" || return 1
            test "$status" = "$expected_status"
          }

          probe_checkout enterprise 422 || FAILED=1
          probe_checkout pro 404 || FAILED=1
          probe_checkout business 404 || FAILED=1

          python3 - \
            "$RUNNER_TEMP/watch-checkout-enterprise.json" \
            "$RUNNER_TEMP/watch-checkout-pro.json" \
            "$RUNNER_TEMP/watch-checkout-business.json" <<'PY' || FAILED=1
          import json
          import sys

          enterprise = json.load(open(sys.argv[1], encoding="utf-8"))
          pro = json.load(open(sys.argv[2], encoding="utf-8"))
          business = json.load(open(sys.argv[3], encoding="utf-8"))

          assert enterprise == {
              "error": {
                  "code": "invalid_plan",
                  "message": "plan must be starter, pro, or business",
              }
          }
          blocked = {
              "error": {
                  "code": "not_found",
                  "message": "Route not found",
              }
          }
          assert pro == blocked
          assert business == blocked
          print("starter_checkout_boundary=bounded")
          PY

          if [ "$SIMULATE_FAILURE" = true ]; then
            echo "simulated_failure=enabled"
            FAILED=1
          fi

          if [ "$FAILED" -eq 0 ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "production_watch=pass"
            exit 0
          fi

          echo "result=fail" >> "$GITHUB_OUTPUT"
          echo "production_watch=blocked"
          exit 1

      - name: Record or update production incident
        if: ${{ steps.synthetic.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          ISSUE_NUMBER="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title == "[ops] AgentPulse production synthetic alert") | .number' \
            | head -1)"

          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          CHECKED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          BODY="$(cat <<EOF
          Production synthetic check failed closed.

          - checked_at: \`$CHECKED_AT\`
          - release_ref: \`$RELEASE_REF\`
          - expected_source_sha: \`$EXPECTED_SOURCE_SHA\`
          - expected_version: \`$EXPECTED_VERSION\`
          - simulated_failure: \`$SIMULATE_FAILURE\`
          - workflow_run: $RUN_URL

          No provider credentials or customer response bodies are included. Inspect the workflow run before any production change.
          EOF
          )"

          if [ -z "$ISSUE_NUMBER" ]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$INCIDENT_TITLE" \
              --body "$BODY"
          else
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$BODY"
          fi

      - name: Resolve recovered production incident
        if: ${{ steps.synthetic.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ISSUE_NUMBER="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title == "[ops] AgentPulse production synthetic alert") | .number' \
            | head -1)"

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "production_incident=none"
            exit 0
          fi

          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          CHECKED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Production synthetic recovered at \`$CHECKED_AT\` on \`$RELEASE_REF\` / \`$EXPECTED_SOURCE_SHA\`. Healthy run: $RUN_URL"
          gh issue close "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --reason completed
          echo "production_incident=resolved"

      - name: Fail visibly after incident recording
        if: ${{ steps.synthetic.outcome == 'failure' }}
        run: exit 1
