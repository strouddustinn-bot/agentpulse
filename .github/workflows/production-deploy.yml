name: Controlled Pilot Production Deploy

on:
  push:
    tags:
      - 'v0.2.0-beta.6'
      - 'v0.2.0-beta.7'

permissions:
  contents: read

concurrency:
  group: agentpulse-production
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify immutable release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release-ref: ${{ steps.identity.outputs.release_ref }}
      source-sha: ${{ steps.identity.outputs.source_sha }}
      package-version: ${{ steps.identity.outputs.package_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan immutable candidate for verified secrets
        uses: trufflesecurity/trufflehog@a7bdcf95222c4369422764e168fad84fc912f0dc # 3.95.9
        with:
          path: ./
          head: ${{ github.sha }}
          version: 3.95.9
          extra_args: --only-verified --exclude-detectors=Lob
      - name: Bind tag, source, and package version
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = v0.2.0-beta.7
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          PACKAGE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$PACKAGE_VERSION" = 0.2.0b6
          echo "release_ref=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned verification dependencies
        run: python -m pip install PyYAML jsonschema openapi-spec-validator build ruff==0.4.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Static production preflight
        run: python scripts/production-preflight.py --release-ref "$GITHUB_REF_NAME" --static-only
      - name: Verify agent, contracts, packaging, and production controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python agent/tools/run_tests.py
          ruff check agent/
          python scripts/validate-contracts.py
          python -m unittest tests.test_packaging -v
          python -m unittest \
            tests.test_ensure_pages_project \
            tests.test_capture_production_provider_state \
            tests.test_production_preflight \
            tests.test_prepare_production_dashboard \
            tests.test_production_smoke \
            -v
      - name: Verify control plane
        working-directory: control-plane
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run typecheck
          npm run types:check
          npm exec --no -- wrangler deploy --env production --strict --dry-run --outdir "$RUNNER_TEMP/worker-dry-run"
      - name: Verify and build production dashboard
        env:
          VITE_API_BASE_URL: https://api.agentpulse.ca
        run: |
          npm --prefix dashboard ci
          npm --prefix dashboard audit --audit-level=high
          npm --prefix dashboard test
          npm --prefix dashboard run build
          python scripts/prepare-production-dashboard.py \
            --dist dashboard/dist \
            --version 0.2.0b6 \
            --source-sha "$GITHUB_SHA"
      - name: Verify repository hardening invariants
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          test -z "$(git ls-files '*/node_modules/*')"
          ! grep -RInE '(sk_live_|whsec_[A-Za-z0-9]|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH) PRIVATE KEY)' \
            agent/agentpulse control-plane/src dashboard/src packages/contracts configs scripts docs \
            --exclude='*.md' --exclude-dir='node_modules'
      - name: Preserve verified dashboard artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-dashboard-${{ github.sha }}
          path: dashboard/dist
          if-no-files-found: error
          retention-days: 30

  deploy-production:
    name: Deploy controlled pilot
    needs: verify-release
    if: ${{ github.ref == 'refs/tags/v0.2.0-beta.7' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_REF: ${{ needs.verify-release.outputs.release-ref }}
      SOURCE_SHA: ${{ needs.verify-release.outputs.source-sha }}
      PACKAGE_VERSION: ${{ needs.verify-release.outputs.package-version }}
      PRODUCTION_D1_NAME: agentpulse-production
      PRODUCTION_PAGES_PROJECT: agentpulse-production-app
      PRODUCTION_PAGES_BRANCH: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reconfirm protected identity and external secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$RELEASE_REF" = v0.2.0-beta.7
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse "${RELEASE_REF}^{commit}")" = "$SOURCE_SHA"
          test "$PACKAGE_VERSION" = 0.2.0b6
          test -z "$(git status --porcelain)"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${STRIPE_API_KEY:-}"
          test -n "${STRIPE_WEBHOOK_SECRET:-}"
          echo "cloudflare_credentials=present"
          echo "stripe_credentials=present"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - name: Install pinned Wrangler
        working-directory: control-plane
        run: npm ci
      - name: Download exact verified dashboard artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-dashboard-${{ github.sha }}
          path: dashboard/dist
      - name: Capture pre-mutation deployment state
        id: provider_state
        working-directory: control-plane
        shell: bash
        run: |
          set -euo pipefail
          npm exec --no -- wrangler d1 migrations list DB --env production --remote > "$RUNNER_TEMP/migrations-before.txt"
          cd ..
          python scripts/capture-production-provider-state.py \
            --worker-name agentpulse-control-plane-production \
            --pages-project "$PRODUCTION_PAGES_PROJECT" \
            --output "$RUNNER_TEMP/provider-state.json"
          readarray -t PROVIDER_FLAGS < <(python3 - "$RUNNER_TEMP/provider-state.json" <<'PY'
          import json, sys
          state = json.load(open(sys.argv[1], encoding="utf-8"))
          for key in (
              "bootstrap_allowed",
              "worker_present",
              "production_pages_deployment_present",
          ):
              print("true" if state[key] else "false")
          PY
          )
          BOOTSTRAP_ALLOWED="${PROVIDER_FLAGS[0]}"
          WORKER_PRESENT="${PROVIDER_FLAGS[1]}"
          PAGES_PRESENT="${PROVIDER_FLAGS[2]}"
          echo "bootstrap_allowed=$BOOTSTRAP_ALLOWED" >> "$GITHUB_OUTPUT"
          cd control-plane
          if [ "$WORKER_PRESENT" = true ]; then
            npm exec --no -- wrangler deployments status --env production --json > "$RUNNER_TEMP/worker-before.json"
          else
            printf '%s\n' '{"state":"not_deployed"}' > "$RUNNER_TEMP/worker-before.json"
          fi
          if [ "$PAGES_PRESENT" = true ]; then
            npm exec --no -- wrangler pages deployment list \
              --project-name "$PRODUCTION_PAGES_PROJECT" \
              --environment production \
              --json > "$RUNNER_TEMP/pages-before.json"
          else
            printf '%s\n' '{"state":"no_production_deployment"}' > "$RUNNER_TEMP/pages-before.json"
          fi
      - name: Live fail-closed production preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/production-preflight.py \
            --release-ref "$RELEASE_REF" \
            --bootstrap-provider-state "$RUNNER_TEMP/provider-state.json" \
            | tee "$RUNNER_TEMP/production-preflight.txt"
          grep -Fx 'stripe_live_prices=verified' "$RUNNER_TEMP/production-preflight.txt"
          grep -Eq '^dns_predeploy=(verified|deferred_first_deploy)$' "$RUNNER_TEMP/production-preflight.txt"
      - name: Export and parse-test pre-migration D1
        id: d1_export
        working-directory: control-plane
        shell: bash
        run: |
          set -euo pipefail
          BACKUP="$RUNNER_TEMP/agentpulse-production-before-${SOURCE_SHA}.sql"
          npm exec --no -- wrangler d1 export DB --env production --remote --output "$BACKUP" -y
          python3 - "$BACKUP" <<'PY'
          import sqlite3, sys
          script = open(sys.argv[1], encoding="utf-8").read()
          connection = sqlite3.connect(":memory:")
          connection.executescript(script)
          connection.close()
          print("d1_restore_parse=pass")
          PY
          sha256sum "$BACKUP" > "$RUNNER_TEMP/d1-backup.sha256"
      - name: Apply production D1 migrations
        id: apply_production_migrations
        working-directory: control-plane
        run: |
          set -euo pipefail
          npm exec --no -- wrangler d1 migrations apply DB --env production --remote
          npm exec --no -- wrangler d1 migrations list DB --env production --remote > "$RUNNER_TEMP/migrations-after.txt"
      - name: Deploy production Worker with external Stripe secrets
        id: deploy_production_worker
        working-directory: control-plane
        shell: bash
        run: |
          set -euo pipefail
          SECRETS_FILE="$RUNNER_TEMP/production-secrets.json"
          trap 'rm -f "$SECRETS_FILE"' EXIT
          python3 - "$SECRETS_FILE" <<'PY'
          import json, os, sys
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump({
                  "STRIPE_API_KEY": os.environ["STRIPE_API_KEY"],
                  "STRIPE_WEBHOOK_SECRET": os.environ["STRIPE_WEBHOOK_SECRET"],
              }, handle)
          os.chmod(sys.argv[1], 0o600)
          PY
          npm exec --no -- wrangler deploy --env production --strict \
            --secrets-file "$SECRETS_FILE" \
            --tag "$RELEASE_REF" \
            --message "git=$SOURCE_SHA release=$RELEASE_REF"
          npm exec --no -- wrangler deployments status --env production --json > "$RUNNER_TEMP/worker-after.json"
      - name: Deploy exact production dashboard artifact
        id: deploy_production_dashboard
        working-directory: control-plane
        run: |
          set -euo pipefail
          npm exec --no -- wrangler pages deploy ../dashboard/dist \
            --project-name "$PRODUCTION_PAGES_PROJECT" \
            --branch "$PRODUCTION_PAGES_BRANCH" \
            --commit-hash "$SOURCE_SHA" \
            --commit-message "AgentPulse $RELEASE_REF"
          npm exec --no -- wrangler pages deployment list \
            --project-name "$PRODUCTION_PAGES_PROJECT" \
            --environment production \
            --json > "$RUNNER_TEMP/pages-after.json"
      - name: Verify production identity and access boundaries
        id: production_smoke
        shell: bash
        run: |
          set -euo pipefail
          python scripts/production-smoke.py \
            --expected-version "$PACKAGE_VERSION" \
            --expected-source-sha "$SOURCE_SHA" \
            --attempts 12 \
            --retry-delay 20 \
            --timeout 5
          probe_checkout() {
            local plan="$1"
            local expected_status="$2"
            local output="$RUNNER_TEMP/checkout-${plan}.json"
            local status
            status="$(curl --silent --show-error --output "$output" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/json' \
              --header 'Content-Type: application/json' \
              --header 'Origin: https://app.agentpulse.ca' \
              --data "{\"plan\":\"${plan}\"}" \
              https://api.agentpulse.ca/v1/billing/checkout)"
            test "$status" = "$expected_status"
          }

          # Distinguish starter mode from both closed and public without
          # creating a live Stripe Checkout Session or D1 checkout row.
          probe_checkout enterprise 422
          probe_checkout pro 404
          probe_checkout business 404

          python3 - \
            "$RUNNER_TEMP/checkout-enterprise.json" \
            "$RUNNER_TEMP/checkout-pro.json" \
            "$RUNNER_TEMP/checkout-business.json" <<'PY'
          import json
          import sys

          enterprise = json.load(open(sys.argv[1], encoding="utf-8"))
          pro = json.load(open(sys.argv[2], encoding="utf-8"))
          business = json.load(open(sys.argv[3], encoding="utf-8"))

          assert enterprise == {
              "error": {
                  "code": "invalid_plan",
                  "message": "plan must be starter, pro, or business",
              }
          }

          blocked = {
              "error": {
                  "code": "not_found",
                  "message": "Route not found",
              }
          }

          assert pro == blocked
          assert business == blocked

          print("starter_checkout=bounded")
          PY
      - name: Capture failure-safe post-mutation state
        if: ${{ always() }}
        working-directory: control-plane
        shell: bash
        env:
          SMOKE_OUTCOME: ${{ steps.production_smoke.outcome }}
          D1_MIGRATION_OUTCOME: ${{ steps.apply_production_migrations.outcome }}
          WORKER_DEPLOY_OUTCOME: ${{ steps.deploy_production_worker.outcome }}
          PAGES_DEPLOY_OUTCOME: ${{ steps.deploy_production_dashboard.outcome }}
        run: |
          set -uo pipefail
          cd ..
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          outcomes = {
              "smoke": os.environ.get("SMOKE_OUTCOME", "unknown"),
              "d1_migration": os.environ.get("D1_MIGRATION_OUTCOME", "unknown"),
              "worker_deploy": os.environ.get("WORKER_DEPLOY_OUTCOME", "unknown"),
              "pages_deploy": os.environ.get("PAGES_DEPLOY_OUTCOME", "unknown"),
          }
          mutated = any(
              outcomes[key] in {"success", "failure"}
              for key in ("d1_migration", "worker_deploy", "pages_deploy")
          )
          smoke_passed = outcomes["smoke"] == "success"
          receipt = {
              "schema_version": 1,
              "release_ref": os.environ["RELEASE_REF"],
              "source_sha": os.environ["SOURCE_SHA"],
              "package_version": os.environ["PACKAGE_VERSION"],
              "deployment_status": (
                  "verified" if smoke_passed else
                  "recovery_required" if mutated else
                  "not_started"
              ),
              "mutation_detected": mutated,
              "step_outcomes": outcomes,
              "next_action": (
                  "none" if smoke_passed else
                  "owner_reconcile_live_state_before_retry_or_rollback"
              ),
          }
          Path("production-failure-state.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"post_mutation_status={receipt['deployment_status']}")
          PY
      - name: Restore pre-migration export into disposable D1
        id: d1_restore_drill
        working-directory: control-plane
        shell: bash
        run: |
          set -euo pipefail
          BACKUP="$RUNNER_TEMP/agentpulse-production-before-${SOURCE_SHA}.sql"
          RESTORE_DB="agentpulse-restore-drill-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$RESTORE_DB" == agentpulse-restore-drill-* ]]
          cleanup() {
            npm exec --no -- wrangler d1 delete "$RESTORE_DB" --skip-confirmation >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          npm exec --no -- wrangler d1 create "$RESTORE_DB"
          npm exec --no -- wrangler d1 execute "$RESTORE_DB" --remote --file "$BACKUP" --yes
          npm exec --no -- wrangler d1 execute "$RESTORE_DB" --remote \
            --command "SELECT COUNT(*) AS table_count FROM sqlite_master WHERE type = 'table';" \
            --json > "$RUNNER_TEMP/d1-restore-check.json"
          python3 - "$RUNNER_TEMP/d1-restore-check.json" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          assert isinstance(payload, list) and payload, "missing D1 restore verification result"
          print("d1_disposable_restore=pass")
          PY
          npm exec --no -- wrangler d1 delete "$RESTORE_DB" --skip-confirmation
          trap - EXIT
          npm exec --no -- wrangler d1 list --json > "$RUNNER_TEMP/d1-after-restore-drill.json"
          python3 - "$RUNNER_TEMP/d1-after-restore-drill.json" "$RESTORE_DB" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          assert all(item.get("name") != sys.argv[2] for item in payload if isinstance(item, dict))
          print("d1_disposable_cleanup=pass")
          PY
          test -z "$(git status --porcelain)"
          printf '%s\n' '{"disposable_d1_restore":"pass","disposable_d1_deleted":true}' \
            > "$RUNNER_TEMP/d1-restore-drill.json"
      - name: Exercise saved-version Worker and immutable console rollback paths
        id: rollback_rehearsal
        working-directory: control-plane
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_VERSION="$(python3 - "$RUNNER_TEMP/worker-after.json" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          versions = payload.get("versions") if isinstance(payload, dict) else None
          assert isinstance(versions, list) and len(versions) == 1
          version = versions[0]
          assert version.get("percentage") == 100
          value = version.get("version_id")
          assert isinstance(value, str) and len(value) == 36
          print(value)
          PY
          )"
          npm exec --no -- wrangler versions view "$CANDIDATE_VERSION" --env production --json \
            > "$RUNNER_TEMP/worker-rollback-target.json"
          npm exec --no -- wrangler versions deploy "$CANDIDATE_VERSION@100%" \
            --env production \
            --message "saved-version recovery rehearsal git=$SOURCE_SHA" \
            --yes
          npm exec --no -- wrangler deployments status --env production --json \
            > "$RUNNER_TEMP/worker-after-rehearsal.json"
          npm exec --no -- wrangler pages deploy ../dashboard/dist \
            --project-name "$PRODUCTION_PAGES_PROJECT" \
            --branch "$PRODUCTION_PAGES_BRANCH" \
            --commit-hash "$SOURCE_SHA" \
            --commit-message "immutable console recovery rehearsal $RELEASE_REF"
          npm exec --no -- wrangler pages deployment list \
            --project-name "$PRODUCTION_PAGES_PROJECT" \
            --environment production \
            --json > "$RUNNER_TEMP/pages-after-rehearsal.json"
          cd ..
          python scripts/production-smoke.py \
            --expected-version "$PACKAGE_VERSION" \
            --expected-source-sha "$SOURCE_SHA" \
            --attempts 5 \
            --retry-delay 10 \
            --timeout 5
          printf '%s\n' '{"worker_saved_version":"pass","console_immutable_artifact":"pass","production_smoke":"pass"}' \
            > "$RUNNER_TEMP/rollback-rehearsal.json"
      - name: Finalize deployment state after all post-deploy checks
        if: ${{ always() }}
        shell: bash
        env:
          ROLLBACK_OUTCOME: ${{ steps.rollback_rehearsal.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("production-failure-state.json")
          receipt = json.loads(path.read_text(encoding="utf-8"))
          rollback_outcome = os.environ.get("ROLLBACK_OUTCOME", "unknown")
          receipt.setdefault("step_outcomes", {})["rollback_rehearsal"] = rollback_outcome
          if receipt["deployment_status"] == "verified" and rollback_outcome != "success":
              receipt["deployment_status"] = "recovery_required"
              receipt["next_action"] = "owner_reconcile_live_state_before_retry_or_rollback"
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"final_deployment_status={receipt['deployment_status']}")
          PY
      - name: Write redacted deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/migrations-before.txt" production-migrations-before.txt
          cp "$RUNNER_TEMP/migrations-after.txt" production-migrations-after.txt
          cp "$RUNNER_TEMP/worker-before.json" production-worker-before.json
          cp "$RUNNER_TEMP/worker-after.json" production-worker-after.json
          cp "$RUNNER_TEMP/pages-before.json" production-pages-before.json
          cp "$RUNNER_TEMP/pages-after.json" production-pages-after.json
          cp "$RUNNER_TEMP/worker-after-rehearsal.json" production-worker-after-rehearsal.json
          cp "$RUNNER_TEMP/pages-after-rehearsal.json" production-pages-after-rehearsal.json
          cp "$RUNNER_TEMP/d1-backup.sha256" production-d1-backup.sha256
          cp "$RUNNER_TEMP/d1-restore-drill.json" production-d1-restore-drill.json
          cp "$RUNNER_TEMP/rollback-rehearsal.json" production-rollback-rehearsal.json
          cp "$RUNNER_TEMP/provider-state.json" production-provider-state.json
          python3 - <<'PY'
          import json, os
          receipt = {
              "release_ref": os.environ["RELEASE_REF"],
              "source_sha": os.environ["SOURCE_SHA"],
              "package_version": os.environ["PACKAGE_VERSION"],
              "d1_name": os.environ["PRODUCTION_D1_NAME"],
              "pages_project": os.environ["PRODUCTION_PAGES_PROJECT"],
              "pages_branch": os.environ["PRODUCTION_PAGES_BRANCH"],
              "app_domain": "app.agentpulse.ca",
              "api_domain": "api.agentpulse.ca",
              "checkout_mode": "starter",
              "stripe_secrets": "external_and_present",
              "stripe_live_prices": "verified",
              "smoke": "pass",
              "d1_disposable_restore": "pass",
              "rollback_rehearsal": "same_version_saved_artifacts_pass",
          }
          with open("production-deployment-receipt.json", "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
      - name: Upload redacted deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-deployment-evidence-${{ github.sha }}
          path: |
            production-failure-state.json
            production-deployment-receipt.json
            production-migrations-before.txt
            production-migrations-after.txt
            production-worker-before.json
            production-worker-after.json
            production-pages-before.json
            production-pages-after.json
            production-worker-after-rehearsal.json
            production-pages-after-rehearsal.json
            production-d1-backup.sha256
            production-d1-restore-drill.json
            production-rollback-rehearsal.json
            production-provider-state.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload initial D1 recovery export
        if: ${{ !cancelled() && steps.d1_export.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-d1-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/agentpulse-production-before-${{ github.sha }}.sql
          if-no-files-found: error
          retention-days: 7