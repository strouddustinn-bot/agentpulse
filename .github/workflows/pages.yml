name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish canonical OpenAPI contract
        run: cp packages/contracts/openapi.yaml docs/api/openapi.yaml
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: docs
          destination: ./_site
      - name: Publish raw agent skill
        run: |
          sudo install -D -m 0644 \
            docs/.well-known/agent-skills/agentpulse-status/SKILL.md \
            _site/.well-known/agent-skills/agentpulse-status/SKILL.md
          sha256sum -c <(printf '%s  %s\n' \
            '269c6f765932d9d6bd5ddb738cdb085e01ebf682f474e90e2b84484a1b94b512' \
            '_site/.well-known/agent-skills/agentpulse-status/SKILL.md')
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
