name: Production Readiness

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  fail-closed-verifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Production preflight, artifact, and smoke tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest \
            tests.test_ensure_pages_project \
            tests.test_production_preflight \
            tests.test_prepare_production_dashboard \
            tests.test_production_smoke \
            -v
