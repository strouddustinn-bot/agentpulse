name: Public Site Probe

on:
  pull_request:
    paths:
      - 'scripts/public-site-smoke.py'
      - '.github/workflows/public-site-probe.yml'
      - '.github/workflows/production-watch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-site:
    name: Public website HTTP health
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Probe canonical website without provider credentials
        run: timeout --kill-after=5s 45s python3 scripts/public-site-smoke.py
