name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run dependency-light agent suite
        run: cd agent && python3 tools/run_tests.py

  agent-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.4.10
      - run: ruff check agent/

  agent-windows-smoke:
    name: agent Windows package/CLI smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install agent package
        run: python -m pip install .
      - name: Import package and POSIX-boundary modules
        run: python -c "import agentpulse.cli, agentpulse.locking, agentpulse.spool"
      - name: Exercise CLI help
        run: python -m agentpulse --help
      - name: Validate example configuration
        run: python -m agentpulse validate agent/agentpulse.config.local.json
      - name: Resolve automatic hostname without POSIX APIs
        run: python -c "from agentpulse.config import Config; assert Config().resolved_hostname()"
      - name: Download checksum-pinned WinSW service host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe'
          $path = Join-Path $env:RUNNER_TEMP 'WinSW-x64-v2.12.0.exe'
          Invoke-WebRequest -Uri $url -OutFile $path
          $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          $expected = '05b82d46ad331cc16bdc00de5c6332c1ef818df8ceefcd49c726553209b3a0da'
          if ($actual -ne $expected) {
            throw "WinSW SHA-256 mismatch: $actual"
          }
          "AGENTPULSE_CI_WINSW=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Create isolated Windows service configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'agentpulse-service-ci'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $configPath = Join-Path $root 'config.json'
          $statePath = Join-Path $root 'state.json'
          $logPath = Join-Path $root 'agentpulse.log'
          $config = @{
            hostname = 'windows-ci'
            interval_seconds = 2
            state_file = $statePath
            log_file = $logPath
            notify = @{ type = 'stdout'; webhook_url = '' }
            checkin = @{ endpoint_url = ''; auth_token = ''; timeout_seconds = 10 }
            control_plane = @{
              enabled = $false
              base_url = ''
              credential_file = (Join-Path $root 'agent.credential')
              timeout_seconds = 10
              local_policy_ceiling = 'alert'
            }
            baseline = @{ enabled = $false }
            checks = @{
              disk = @{ mode = 'off'; threshold_percent = 90; paths = @('C:\') }
              service = @{ mode = 'off'; services = @() }
              process = @{ mode = 'off'; mem_percent_threshold = 85 }
            }
          }
          $config | ConvertTo-Json -Depth 8 | Set-Content -Path $configPath -Encoding utf8NoBOM
          "AGENTPULSE_CI_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AGENTPULSE_CI_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AGENTPULSE_CI_STATE=$statePath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install and exercise real Windows service lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $agentBin = (Get-Command agentpulse).Source
          $serviceDir = Join-Path $env:AGENTPULSE_CI_ROOT 'service'
          $logDir = Join-Path $env:AGENTPULSE_CI_ROOT 'logs'
          python -m agentpulse install-windows-service `
            --winsw-bin $env:AGENTPULSE_CI_WINSW `
            --agent-bin $agentBin `
            --config $env:AGENTPULSE_CI_CONFIG `
            --service-id AgentPulseCI `
            --display-name 'AgentPulse CI' `
            --install-dir $serviceDir `
            --log-dir $logDir
          if ($LASTEXITCODE -ne 0) { throw 'AgentPulse service install failed' }
          Start-Sleep -Seconds 5
          $service = Get-Service -Name AgentPulseCI -ErrorAction Stop
          if ($service.Status -ne 'Running') { throw "unexpected service state: $($service.Status)" }
          if (-not (Test-Path $env:AGENTPULSE_CI_STATE)) { throw 'service did not persist state' }
          python -c "from agentpulse.checks import check_services; from agentpulse.config import ServiceCheckConfig; o=check_services(ServiceCheckConfig(services=['AgentPulseCI'])); assert len(o) == 1 and not o[0].breached, o[0]"
          python -c "from agentpulse.models import Decision, Observation; from agentpulse.remediation import service_restart; o=Observation(check='service', target='AgentPulseCI', breached=True, metadata={'service':'AgentPulseCI'}); d=Decision(action='service_restart', target='AgentPulseCI', mode_effective='auto', execute=True, requires_approval=False, reason='CI lifecycle proof', observation=o); r=service_restart(d); assert r.ok and r.performed, r.error"
          $service.Refresh()
          if ($service.Status -ne 'Running') { throw "service restart left state: $($service.Status)" }
      - name: Uninstall Windows service fixture
        if: always()
        shell: pwsh
        run: |
          $serviceDir = Join-Path $env:AGENTPULSE_CI_ROOT 'service'
          $wrapper = Join-Path $serviceDir 'AgentPulseService.exe'
          if (Test-Path $wrapper) {
            python -m agentpulse uninstall-windows-service `
              --service-id AgentPulseCI `
              --install-dir $serviceDir `
              --remove-files
          }

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML jsonschema openapi-spec-validator
      - run: python scripts/validate-contracts.py
      - run: python -m unittest tests.test_contract_validation -v
      - run: python scripts/validate-migrations.py
      - name: Validate shipped agent configurations
        run: |
          python - <<'PY'
          import json
          import jsonschema

          with open("configs/agentpulse.config.schema.json", encoding="utf-8") as handle:
              schema = json.load(handle)
          jsonschema.Draft7Validator.check_schema(schema)
          validator = jsonschema.Draft7Validator(
              schema,
              format_checker=jsonschema.FormatChecker(),
          )
          for path in (
              "agent/agentpulse.config.example.json",
              "agent/agentpulse.config.local.json",
          ):
              with open(path, encoding="utf-8") as handle:
                  validator.validate(json.load(handle))
              print(f"Config PASS: {path}")
          PY

  control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run types:check
      - name: Diagnose generated Wrangler type drift
        if: failure()
        run: |
          npm run types
          git diff -- worker-configuration.d.ts | sed -n '1,220p'

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Mocked console E2E
        run: npm run test:e2e

  packaging:
    name: agent packaging (wheel install)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build tooling
        run: python -m pip install --upgrade pip build
      - name: Packaging integrity + fresh-venv CLI smoke
        run: python -m unittest tests.test_packaging -v
      - name: Linux installer syntax
        run: bash -n scripts/install-agent.sh scripts/upgrade-agent.sh scripts/rollback-agent.sh scripts/smoke-test.sh docs/install.sh
      - name: launchd plist is well-formed XML
        run: python scripts/check-launchd-plist.py
