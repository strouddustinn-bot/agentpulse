name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run dependency-light agent suite
        run: cd agent && python3 tools/run_tests.py

  agent-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.4.10
      - run: ruff check agent/

  agent-windows-smoke:
    name: agent Windows package/CLI smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install agent package
        run: python -m pip install .
      - name: Import package and POSIX-boundary modules
        run: python -c "import agentpulse.cli, agentpulse.locking, agentpulse.spool"
      - name: Exercise CLI help
        run: python -m agentpulse --help
      - name: Validate example configuration
        run: python -m agentpulse validate agent/agentpulse.config.local.json
      - name: Resolve automatic hostname without POSIX APIs
        run: python -c "from agentpulse.config import Config; assert Config().resolved_hostname()"

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML jsonschema openapi-spec-validator
      - run: python scripts/validate-contracts.py
      - run: python -m unittest tests.test_contract_validation -v
      - run: python scripts/validate-migrations.py
      - name: Validate shipped agent configurations
        run: |
          python - <<'PY'
          import json
          import jsonschema

          with open("configs/agentpulse.config.schema.json", encoding="utf-8") as handle:
              schema = json.load(handle)
          jsonschema.Draft7Validator.check_schema(schema)
          validator = jsonschema.Draft7Validator(
              schema,
              format_checker=jsonschema.FormatChecker(),
          )
          for path in (
              "agent/agentpulse.config.example.json",
              "agent/agentpulse.config.local.json",
          ):
              with open(path, encoding="utf-8") as handle:
                  validator.validate(json.load(handle))
              print(f"Config PASS: {path}")
          PY

  control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run types:check

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Mocked console E2E
        run: npm run test:e2e

  packaging:
    name: agent packaging (wheel install)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build tooling
        run: python -m pip install --upgrade pip build
      - name: Packaging integrity + fresh-venv CLI smoke
        run: python -m unittest tests.test_packaging -v
      - name: Linux installer syntax
        run: bash -n scripts/install-agent.sh scripts/upgrade-agent.sh scripts/rollback-agent.sh scripts/smoke-test.sh docs/install.sh
      - name: launchd plist is well-formed XML
        run: python scripts/check-launchd-plist.py
